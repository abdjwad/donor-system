<section class="stats-section">
  <div class="stats-section__gold-top"></div>

  <div class="stats-section__inner">

    <div class="stat-block">
      <span class="stat-number">{{ stats.donors | number }}+</span>
      <span class="stat-label">{{ 'HOME.STATS.DONORS' | translate }}</span>
    </div>

    <div class="stats-section__separator"></div>

    <div class="stat-block">
      <span class="stat-number">{{ stats.families | number }}+</span>
      <span class="stat-label">{{ 'HOME.STATS.FAMILIES' | translate }}</span>
    </div>

    <div class="stats-section__separator"></div>

    <div class="stat-block">
      <span class="stat-number">{{ stats.projects | number }}+</span>
      <span class="stat-label">{{ 'HOME.STATS.PROJECTS' | translate }}</span>
    </div>

    <div class="stats-section__separator"></div>

    <div class="stat-block">
      <span class="stat-number">$2.4M+</span>
      <span class="stat-label">{{ 'HOME.STATS.AMOUNT' | translate }}</span>
    </div>

  </div>

  <div class="stats-section__gold-bottom"></div>
</section>
