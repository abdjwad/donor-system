<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <pattern id="damascus" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
      <!-- Damascus geometric tilework — 8-pointed star motif -->
      <!-- Outer octagon -->
      <polygon points="60,8 80,20 92,40 92,80 80,100 60,112 40,100 28,80 28,40 40,20"
               fill="none" stroke="white" stroke-width="0.8" opacity="0.6"/>
      <!-- Inner 8-pointed star -->
      <polygon points="60,22 70,38 87,35 78,50 87,65 70,62 60,78 50,62 33,65 42,50 33,35 50,38"
               fill="none" stroke="white" stroke-width="0.7" opacity="0.5"/>
      <!-- Center diamond -->
      <polygon points="60,44 72,56 60,68 48,56"
               fill="none" stroke="white" stroke-width="0.8" opacity="0.7"/>
      <!-- Corner decorative squares -->
      <rect x="0" y="0" width="18" height="18" fill="none" stroke="white" stroke-width="0.5" opacity="0.4" transform="rotate(45 9 9)"/>
      <rect x="102" y="0" width="18" height="18" fill="none" stroke="white" stroke-width="0.5" opacity="0.4" transform="rotate(45 111 9)"/>
      <rect x="0" y="102" width="18" height="18" fill="none" stroke="white" stroke-width="0.5" opacity="0.4" transform="rotate(45 9 111)"/>
      <rect x="102" y="102" width="18" height="18" fill="none" stroke="white" stroke-width="0.5" opacity="0.4" transform="rotate(45 111 111)"/>
      <!-- Connecting lines -->
      <line x1="0" y1="60" x2="28" y2="60" stroke="white" stroke-width="0.5" opacity="0.3"/>
      <line x1="92" y1="60" x2="120" y2="60" stroke="white" stroke-width="0.5" opacity="0.3"/>
      <line x1="60" y1="0" x2="60" y2="22" stroke="white" stroke-width="0.5" opacity="0.3"/>
      <line x1="60" y1="78" x2="60" y2="120" stroke="white" stroke-width="0.5" opacity="0.3"/>
      <!-- Diagonal cross lines -->
      <line x1="0" y1="0" x2="28" y2="28" stroke="white" stroke-width="0.4" opacity="0.2"/>
      <line x1="120" y1="0" x2="92" y2="28" stroke="white" stroke-width="0.4" opacity="0.2"/>
      <line x1="0" y1="120" x2="28" y2="92" stroke="white" stroke-width="0.4" opacity="0.2"/>
      <line x1="120" y1="120" x2="92" y2="92" stroke="white" stroke-width="0.4" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="120" height="120" fill="url(#damascus)"/>
</svg>
